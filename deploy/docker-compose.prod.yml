services:
  new-api:
    build:
      context: ${DEPLOY_ROOT:?DEPLOY_ROOT is required}
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-kkcode-new-api:local}
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    volumes:
      - ${DEPLOY_ROOT:?DEPLOY_ROOT is required}/data:/data
      - ${DEPLOY_ROOT:?DEPLOY_ROOT is required}/logs:/app/logs
    environment:
      SQL_DSN: postgresql://root:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/new-api
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      TZ: ${TZ:-Asia/Shanghai}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CRYPTO_SECRET: ${CRYPTO_SECRET:?CRYPTO_SECRET is required}
      GLOBAL_WEB_RATE_LIMIT_ENABLE: "false"
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      NODE_NAME: ${NODE_NAME:-new-api-node-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - new-api-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:3000/api/status | grep -Eq '\"success\"[[:space:]]*:[[:space:]]*true'",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE:-redis:latest}
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - new-api-network

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15}
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - new-api-network

volumes:
  pg_data:
    name: ${POSTGRES_VOLUME_NAME:-new-api_pg_data}

networks:
  new-api-network:
    name: ${NETWORK_NAME:-new-api_new-api-network}
